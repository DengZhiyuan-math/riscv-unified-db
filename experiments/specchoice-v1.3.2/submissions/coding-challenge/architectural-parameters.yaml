      - name: CACHE_BLOCK_SIZE
        name_status: existing_udb_verified
        name_source: spec/std/isa/param/CACHE_BLOCK_SIZE.yaml
        source_phrase: size of a cache block
        description: >-
          Size of the contiguous, naturally aligned power-of-two range
          represented by one cache block.
        type: integer
        type_support: inferred_from_power_of_two_range
        units: null
        constraints:
          implementation_specific: true
          power_of_two: true
          naturally_aligned: true
          uniform_throughout_system: true
          uniformity_scope: initial set of CMO extensions
          maximum: null
        evidence:
          - >-
            Caches organize copies of data into cache blocks, each of which
            represents a contiguous, naturally aligned power-of-two (or NAPOT)
            range of memory locations.
          - >-
            The capacity and organization of a cache and the size of a cache
            block are both implementation-specific
          - >-
            In the initial set of CMO extensions, the size of a cache block
            shall be uniform throughout the system.
