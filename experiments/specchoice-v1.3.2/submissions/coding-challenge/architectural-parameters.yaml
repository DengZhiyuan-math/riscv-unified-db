    non_parameters:
      - text: CSR address width
        observed_value: 12
        reason: The ISA fixes the encoding width; the implementation does not choose it.
        evidence:
          - >-
            The standard RISC-V ISA sets aside a 12-bit encoding space
            (csr[11:0]) for up to 4,096 CSRs.
      - text: maximum CSR encodings
        observed_value: 4096
        reason: This value is derived from the fixed 12-bit encoding space.
        evidence:
          - >-
            The standard RISC-V ISA sets aside a 12-bit encoding space
            (csr[11:0]) for up to 4,096 CSRs.
      - text: CSR read/write accessibility encoding
        observed_value: "csr[11:10]"
        reason: The ISA fixes the meaning of these address bits.
        evidence:
          - >-
            The top two bits (csr[11:10]) indicate whether the register is
            read/write (00, 01, or 10) or read-only (11).
      - text: CSR minimum privilege encoding
        observed_value: "csr[9:8]"
        reason: The ISA fixes the meaning of these address bits.
        evidence:
          - >-
            The next two bits (csr[9:8]) encode the lowest privilege level that
            can access the CSR.
